<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'none'; object-src 'none'; base-uri 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Najwa AI</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <aside id="sidebar">
      <div class="sidebar-head">
        <div class="brand"><svg class="brand-mark" viewBox="96 96 320 310" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M108.1 216.0 106.7 226.8 106.0 237.6 106.2 248.5 107.1 259.3 108.8 270.0 111.3 280.6 114.6 291.0 118.5 301.1 123.3 310.9 128.7 320.3 134.7 329.3 141.4 337.8 148.7 345.9 156.6 353.3 165.0 360.2 173.9 366.5 183.2 372.1 192.8 377.1 202.9 381.3 213.1 384.7 223.7 387.5 234.3 389.4 245.1 390.6 256.0 391.0 266.9 390.6 277.7 389.4 288.3 387.5 298.9 384.7 309.1 381.3 319.2 377.1 328.8 372.1 338.1 366.5 347.0 360.2 355.4 353.3 363.3 345.9 370.6 337.8 377.3 329.3 383.3 320.3 388.7 310.9 393.5 301.1 397.4 291.0 400.7 280.6 403.2 270.0 404.9 259.3 405.8 248.5 406.0 237.6 405.3 226.8 403.9 216.0 382.0 216.0 381.7 224.2 380.9 232.4 379.6 240.6 377.7 248.6 375.3 256.5 372.4 264.2 369.0 271.7 365.1 279.0 360.8 286.0 356.0 292.7 350.7 299.1 345.1 305.1 339.1 310.7 332.7 316.0 326.0 320.8 319.0 325.1 311.7 329.0 304.2 332.4 296.5 335.3 288.6 337.7 280.6 339.6 272.4 340.9 264.2 341.7 256.0 342.0 247.8 341.7 239.6 340.9 231.4 339.6 223.4 337.7 215.5 335.3 207.8 332.4 200.3 329.0 193.0 325.1 186.0 320.8 179.3 316.0 172.9 310.7 166.9 305.1 161.3 299.1 156.0 292.7 151.2 286.0 146.9 279.0 143.0 271.7 139.6 264.2 136.7 256.5 134.3 248.6 132.4 240.6 131.1 232.4 130.3 224.2 130.0 216.0Z"/><circle fill="currentColor" cx="119.05" cy="216" r="10.95"/><circle fill="currentColor" cx="392.95" cy="216" r="10.95"/><path fill="#ffc658" d="M256 110L290 156L256 202L222 156Z"/></svg> <span id="brandName">Najwa AI</span></div>
        <button id="newChatBtn" class="btn primary block" title="New chat (Ctrl+N)">＋ New chat</button>
        <input id="searchInput" class="input" type="search" placeholder="Search all chats (Ctrl+K)" />
      </div>
      <nav id="chatList" aria-label="Chats"></nav>
      <div class="sidebar-foot">
        <button id="settingsBtn" class="btn ghost block" title="Settings (Ctrl+,)">⚙ Settings</button>
        <button id="syncBtn" class="sync-status" hidden></button>
        <button id="creditBtn" class="credit" title="About Najwa AI">Najwa AI by Bandar Altariqi</button>
      </div>
    </aside>

    <div id="drawerBackdrop"></div>

    <main id="main">
      <header id="topbar">
        <button id="toggleSidebarBtn" class="icon-btn" title="Toggle sidebar (Ctrl+B)">☰</button>
        <h1 id="chatTitle" dir="auto" title="Click to rename">New chat</h1>
        <div class="topbar-controls">
          <select id="assistantSelect" class="select" title="Assistant"></select>
          <select id="modelSelect" class="select" title="Model"></select>
          <button id="refreshModelsBtn" class="icon-btn" title="Refresh model list">⟳</button>
          <div class="menu-wrap">
            <button id="chatMenuBtn" class="icon-btn" title="Chat options">⋯</button>
            <div id="chatMenu" class="menu" hidden>
              <button data-action="rename">Rename</button>
              <button data-action="pin">Pin</button>
              <button data-action="system">Custom instructions…</button>
              <button data-action="export">Export as Markdown…</button>
              <button data-action="delete" class="danger">Delete chat</button>
            </div>
          </div>
        </div>
      </header>

      <section id="messages" aria-live="polite"></section>

      <footer id="composer">
        <div id="attachments" class="attachments" hidden></div>
        <div class="composer-box">
          <button id="attachBtn" class="icon-btn attach-btn" title="Add a picture" aria-label="Add a picture">
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Zm0 16H5V5h14v14Zm-4.9-7.1-3 3.9L9 13.2 6 17h12l-3.9-5.1ZM8.5 10A1.5 1.5 0 1 0 8.5 7a1.5 1.5 0 0 0 0 3Z"/></svg>
          </button>
          <input id="attachInput" type="file" accept="image/*" multiple hidden>
          <textarea id="input" dir="auto" rows="1" placeholder="Message Najwa AI…"></textarea>
          <button id="micBtn" class="icon-btn mic-btn" title="Talk instead of typing" aria-label="Talk instead of typing" hidden>
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg>
          </button>
          <button id="sendBtn" class="btn primary" title="Send">Send</button>
        </div>
        <div id="composerHint" class="hint">Enter to send · Shift+Enter for a new line · every chat is saved automatically</div>
      </footer>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div id="toast" role="status" hidden></div>

  <script src="../node_modules/marked/lib/marked.umd.js"></script>
  <script src="../node_modules/dompurify/dist/purify.min.js"></script>
  <script src="speech-text.js"></script>
  <script src="app.js"></script>
</body>
</html>
