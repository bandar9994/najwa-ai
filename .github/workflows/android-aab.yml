name: Android app bundle (Google Play)

# Builds the signed .aab that is uploaded to Google Play. Run it by hand from the
# Actions tab, or push a tag like android-v1.0.0. Needs the signing secrets
# BALIMDA_KEYSTORE_BASE64, BALIMDA_KEYSTORE_PASSWORD, BALIMDA_KEY_ALIAS and
# BALIMDA_KEY_PASSWORD (your private upload key). It never uses the test key.
on:
  workflow_dispatch:
    inputs:
      version_code_offset:
        description: 'Number added to the run number to make the Play versionCode (use it to go above a versionCode already uploaded)'
        required: false
        default: '0'
  push:
    tags: ['android-v*']

jobs:
  aab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BALIMDA_KEYSTORE_BASE64: ${{ secrets.BALIMDA_KEYSTORE_BASE64 }}
      BALIMDA_KEYSTORE_PASSWORD: ${{ secrets.BALIMDA_KEYSTORE_PASSWORD }}
      BALIMDA_KEY_ALIAS: ${{ secrets.BALIMDA_KEY_ALIAS }}
      BALIMDA_KEY_PASSWORD: ${{ secrets.BALIMDA_KEY_PASSWORD }}
      VERSION_CODE_OFFSET: ${{ inputs.version_code_offset || '0' }}
      NAJWA_STORE: play
    steps:
      - name: Check the signing secrets are set
        run: |
          missing=""
          for v in BALIMDA_KEYSTORE_BASE64 BALIMDA_KEYSTORE_PASSWORD BALIMDA_KEY_ALIAS BALIMDA_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error title=Signing secrets missing::Add these repository secrets, then run again:$missing"
            exit 1
          fi
          case "$VERSION_CODE_OFFSET" in
            ''|*[!0-9]*) echo "::error::version_code_offset must be a whole number"; exit 1;;
          esac
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - run: npx cap sync android
      - name: Decode the upload key
        run: |
          echo "$BALIMDA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/balimda-upload.keystore"
          echo "BALIMDA_KEYSTORE_FILE=$RUNNER_TEMP/balimda-upload.keystore" >> "$GITHUB_ENV"
      - name: Build the app bundle
        working-directory: android
        run: ./gradlew bundleRelease --no-daemon
      - name: Copy the bundle
        run: cp android/app/build/outputs/bundle/release/app-release.aab Najwa-AI-android.aab
      - name: Verify the bundle is signed with your upload key
        run: |
          jarsigner -verify -certs Najwa-AI-android.aab | tee jarsigner.txt | tail -5
          grep -q 'jar verified' jarsigner.txt || { echo "::error::The bundle's signature did not verify"; exit 1; }
          # Never ship a bundle signed with the public test key.
          keytool -printcert -jarfile Najwa-AI-android.aab > cert.txt
          SHA1=$(grep -m1 'SHA1:' cert.txt | sed 's/^.*SHA1: *//')
          TEST_SHA256=$(keytool -list -keystore android/app/balimda-test.keystore -storepass android -alias balimda | grep -m1 'SHA-256' | sed 's/^[^:]*: *//')
          [ -n "$SHA1" ] && [ -n "$TEST_SHA256" ] || { echo "::error::Could not read the signing certificate"; exit 1; }
          if grep -q "SHA256: $TEST_SHA256" cert.txt; then echo "::error::The bundle is signed with the public test key"; exit 1; fi
          echo "::notice title=Upload key SHA-1::$SHA1"
          echo "**Upload key SHA-1** (for the Android OAuth client in Google Cloud): \`$SHA1\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**versionCode**: run number ${GITHUB_RUN_NUMBER} + offset ${VERSION_CODE_OFFSET}" >> "$GITHUB_STEP_SUMMARY"
      - name: Check the native engine is in the bundle
        run: |
          unzip -l Najwa-AI-android.aab | grep -E 'lib/.*\.so$' | tee native-libs.txt
          grep -q 'libbalimda_llama.so' native-libs.txt || { echo "::error::libbalimda_llama.so is missing from the bundle"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: Najwa-AI-android-aab
          path: Najwa-AI-android.aab
          if-no-files-found: error
