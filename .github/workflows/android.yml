name: Android app

on:
  push:
    branches: ['main', 'bandar/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to publish the APK to the "android-latest" release
    env:
      # Your own signing key (see README) -- needed before publishing. Without it
      # a debug APK signed with the test key in android/app is built instead
      # (fine for your own phone).
      BALIMDA_KEYSTORE_BASE64: ${{ secrets.BALIMDA_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - run: npx cap sync android
      - name: Use your own signing key
        if: env.BALIMDA_KEYSTORE_BASE64 != ''
        run: |
          echo "$BALIMDA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/balimda.keystore"
          echo "BALIMDA_KEYSTORE_FILE=$RUNNER_TEMP/balimda.keystore" >> "$GITHUB_ENV"
      # Release builds are signed only with your private key and fail without it.
      # When the signing secrets aren't set (forks, pull requests, a fresh repo)
      # this builds the debug APK instead, signed with the test key in
      # android/app: fine for your own phone, never published.
      - name: Build APK
        working-directory: android
        env:
          BALIMDA_KEYSTORE_PASSWORD: ${{ secrets.BALIMDA_KEYSTORE_PASSWORD }}
          BALIMDA_KEY_ALIAS: ${{ secrets.BALIMDA_KEY_ALIAS }}
          BALIMDA_KEY_PASSWORD: ${{ secrets.BALIMDA_KEY_PASSWORD }}
        run: |
          if [ -n "$BALIMDA_KEYSTORE_BASE64" ]; then
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../Najwa-AI-android.apk
          else
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk ../Najwa-AI-android.apk
          fi
      # The native AI engine must be inside the APK, or the app falls back to
      # the much slower WebAssembly engine.
      - name: Check the native engine is in the APK
        run: |
          unzip -l Najwa-AI-android.apk | grep -E 'lib/.*\.so$' | tee native-libs.txt
          grep -q 'libbalimda_llama.so' native-libs.txt || { echo "::error::libbalimda_llama.so is missing from the APK"; exit 1; }
      # Google sign-in (Drive sync) recognises the app by its package name and
      # this fingerprint, which goes into the Android OAuth client in Google
      # Cloud. It's public (anyone can read it from the APK).
      - name: Show the signing certificate's SHA-1
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          SHA1=$("$APKSIGNER" verify --print-certs Najwa-AI-android.apk | grep -m1 'SHA-1 digest' | sed 's/.*: //' | tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//')
          KEY=$([ -n "$BALIMDA_KEYSTORE_BASE64" ] && echo "your private key" || echo "the test key")
          echo "::notice title=SHA-1 fingerprint ($KEY)::$SHA1"
          echo "**SHA-1 certificate fingerprint** ($KEY), for the Android OAuth client in Google Cloud: \`$SHA1\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: Najwa-AI-android-apk
          path: Najwa-AI-android.apk
          if-no-files-found: error
      # One fixed link that always has the newest APK (no zip):
      # https://github.com/<owner>/<repo>/releases/download/android-latest/Najwa-AI-android.apk
      - name: Signing key missing
        if: env.BALIMDA_KEYSTORE_BASE64 == ''
        run: echo "::warning::Built with the test key (BALIMDA_KEYSTORE_* secrets not set). This APK is only attached to this run, not published to the android-latest release."
      # Only builds signed with the private key go to the public download link,
      # so people never get an APK that can't update their installed app. And
      # only from main: work on other branches isn't released until it's merged
      # (its APK is still attached to the run above for testing).
      - name: Publish to the android-latest release
        if: ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch') && env.BALIMDA_KEYSTORE_BASE64 != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The version is in the release's title (the app's versionName,
          # 1.0.<run number>): app stores that track releases, like Orion Store
          # and Obtainium, read it from there.
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          TITLE="Najwa AI for Android ${VERSION}"
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --prerelease --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes "Newest Android build. Download Najwa-AI-android.apk and open it on your phone; it installs over the previous version and keeps your chats."
          fi
          gh release upload android-latest Najwa-AI-android.apk --clobber
          gh release delete-asset android-latest Pal-android.apk --yes 2>/dev/null || true
          # Files from before the app was renamed (Balimda -> Najwa AI), and the
          # versioned copies earlier builds added (the title has the version now):
          # one APK per release.
          gh release view android-latest --json assets --jq '.assets[].name' | { grep -E '^Balimda-|^Najwa-AI-v[0-9.]+\.apk$' || true; } | while read -r old; do
            gh release delete-asset android-latest "$old" --yes || true
          done
          gh release edit android-latest --title "$TITLE" --notes "Najwa AI ${VERSION} for Android (from ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M UTC')). Download Najwa-AI-android.apk and open it on your phone; it installs over the previous version and keeps your chats."
