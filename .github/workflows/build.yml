name: Build installers

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Google sign-in for Drive sync. Without these secrets the app still
      # builds, but only offers GitHub for sync.
      - name: Add Google sign-in client
        shell: bash
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.BALIMDA_GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.BALIMDA_GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::warning::BALIMDA_GOOGLE_CLIENT_ID / BALIMDA_GOOGLE_CLIENT_SECRET are not set, so this build can't sync with Google Drive."
            exit 0
          fi
          node -e "require('fs').writeFileSync('google-oauth.json', JSON.stringify({ clientId: process.env.GOOGLE_CLIENT_ID, clientSecret: process.env.GOOGLE_CLIENT_SECRET }))"
      # Whisper, for talking to Najwa AI on the computer (see scripts/build-whisper.js).
      - name: Build speech recognition (Whisper)
        run: node scripts/build-whisper.js
      - run: npx electron-builder --publish never
      - name: Check speech recognition is in the app
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) dpkg-deb -c dist/*.deb | grep -E '^-rwx.*/resources/whisper/whisper-server$' ;;
            Windows) ls -la dist/win-unpacked/resources/whisper/whisper-server.exe ;;
            macOS) ls -la dist/mac-arm64/*.app/Contents/Resources/whisper/whisper-server dist/mac/*.app/Contents/Resources/whisper/whisper-server ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: balimda-desktop-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

  # Newest installers under fixed names, so the README can link straight to
  # them: https://github.com/<owner>/<repo>/releases/tag/desktop-latest
  publish:
    needs: build
    # Only builds of main (or a release tag) are published; a branch can be
    # built by hand to try it without replacing the download.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    concurrency:
      group: desktop-latest
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: balimda-desktop-*
          merge-multiple: true
      - name: Give the installers fixed names
        run: |
          mkdir out
          for f in artifacts/*; do
            case "$f" in
              *.exe) cp "$f" out/Najwa-AI-Windows-Setup.exe ;;
              *arm64*.dmg) cp "$f" out/Najwa-AI-macOS-AppleSilicon.dmg ;;
              *.dmg) cp "$f" out/Najwa-AI-macOS-Intel.dmg ;;
              *.AppImage) cp "$f" out/Najwa-AI-Linux.AppImage ;;
              *.deb) cp "$f" out/Najwa-AI-Linux.deb ;;
            esac
          done
          ls -la out
      - name: Publish to the desktop-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Newest desktop build (from ${GITHUB_SHA::7}, $(date -u '+%Y-%m-%d %H:%M UTC')). Windows: Najwa-AI-Windows-Setup.exe. Mac: Najwa-AI-macOS-AppleSilicon.dmg (M1 and newer) or Najwa-AI-macOS-Intel.dmg. Linux: Najwa-AI-Linux.AppImage or Najwa-AI-Linux.deb."
          if ! gh release view desktop-latest >/dev/null 2>&1; then
            gh release create desktop-latest --prerelease --target "$GITHUB_SHA" --title "Najwa AI for Windows, macOS and Linux (latest build)" --notes "$notes"
          fi
          gh release upload desktop-latest out/* --clobber
          # Files from before the app was renamed (Balimda -> Najwa AI).
          gh release view desktop-latest --json assets --jq '.assets[].name' | { grep -E '^Balimda-' || true; } | while read -r old; do
            gh release delete-asset desktop-latest "$old" --yes || true
          done
          gh release edit desktop-latest --title "Najwa AI for Windows, macOS and Linux (latest build)" --notes "$notes"
