apply plugin: 'com.android.application'

// Release signing inputs. Names are kept from the earlier setup so existing CI
// secrets keep working: BALIMDA_KEYSTORE_FILE, BALIMDA_KEYSTORE_PASSWORD,
// BALIMDA_KEY_ALIAS, BALIMDA_KEY_PASSWORD.
def releaseSigningEnv = [
    file         : System.getenv("BALIMDA_KEYSTORE_FILE"),
    storePassword: System.getenv("BALIMDA_KEYSTORE_PASSWORD"),
    keyAlias     : System.getenv("BALIMDA_KEY_ALIAS"),
    keyPassword  : System.getenv("BALIMDA_KEY_PASSWORD"),
]
releaseSigningEnv.complete = releaseSigningEnv.file && releaseSigningEnv.storePassword &&
        releaseSigningEnv.keyAlias && releaseSigningEnv.keyPassword

// Which store the build is for. Set NAJWA_STORE=play (or -PnajwaStore=play) for
// the Google Play build, which has no donation link. Left empty, nothing
// changes: GitHub and sideloaded builds are the default. Read by the web layer
// through StorePlugin (BuildConfig.NAJWA_STORE).
def najwaStore = (System.getenv("NAJWA_STORE") ?: project.findProperty("najwaStore") ?: "")
        .toString().trim().toLowerCase().replaceAll("[^a-z0-9_-]", "")

android {
    namespace = "com.bandaraltariqi.najwa"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.bandaraltariqi.najwa"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // CI sets the build number so each new APK installs as an update.
        // VERSION_CODE_OFFSET (default 0) is added on top, e.g. to jump above the
        // versionCode of a build that is already uploaded to Google Play.
        versionCode Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1") + Integer.parseInt(System.getenv("VERSION_CODE_OFFSET") ?: "0")
        versionName "1.0.${System.getenv("GITHUB_RUN_NUMBER") ?: "0"}"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "NAJWA_STORE", "\"${najwaStore}\""
        // The native llama.cpp engine is built for 64-bit ARM phones.
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared", "-DCMAKE_BUILD_TYPE=Release"
            }
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Debug builds (your own phone, CI test runs) use the public test key
        // committed in this folder. Anyone with this repository has it, so it
        // must never sign anything you publish.
        testKey {
            storeFile file("balimda-test.keystore")
            storePassword "android"
            keyAlias "balimda"
            keyPassword "android"
        }
        // Release builds are signed ONLY with your private key, given through
        // these environment variables (in CI they come from GitHub secrets).
        // There is no fallback to the test key: if any is missing, the release
        // build fails (see the check below).
        if (releaseSigningEnv.complete) {
            release {
                storeFile file(releaseSigningEnv.file)
                storePassword releaseSigningEnv.storePassword
                keyAlias releaseSigningEnv.keyAlias
                keyPassword releaseSigningEnv.keyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.testKey
        }
        release {
            if (releaseSigningEnv.complete) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    externalNativeBuild {
        cmake {
            path "src/main/cpp/CMakeLists.txt"
            version "3.22.1"
        }
    }
    ndkVersion "27.2.12479018"
    packaging {
        jniLibs {
            // Link-time stub only: the phone's own OpenCL driver is used at runtime.
            excludes += ["**/libOpenCL.so"]
            useLegacyPackaging = false
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Google sign-in for Drive sync (GoogleAuthPlugin)
    implementation "com.google.android.gms:play-services-auth:22.0.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Fail early, with a clear message, when a release APK/AAB is requested without
// the private signing key. Debug builds and other tasks (help, tasks, lint of
// debug, ...) are not affected.
gradle.taskGraph.whenReady { graph ->
    def wantsSignedRelease = graph.allTasks.any {
        it.project == project && it.name ==~ /^(assemble|bundle|package|sign|install)Release.*/
    }
    if (wantsSignedRelease) {
        def missing = []
        if (!releaseSigningEnv.file) missing << "BALIMDA_KEYSTORE_FILE"
        if (!releaseSigningEnv.storePassword) missing << "BALIMDA_KEYSTORE_PASSWORD"
        if (!releaseSigningEnv.keyAlias) missing << "BALIMDA_KEY_ALIAS"
        if (!releaseSigningEnv.keyPassword) missing << "BALIMDA_KEY_PASSWORD"
        if (missing) {
            throw new GradleException("Release build needs your private signing key, but these environment variables are not set: " +
                    missing.join(", ") + ". Release builds never use the public test key. " +
                    "Create an upload keystore and set BALIMDA_KEYSTORE_FILE (path), BALIMDA_KEYSTORE_PASSWORD, " +
                    "BALIMDA_KEY_ALIAS and BALIMDA_KEY_PASSWORD (in CI: the BALIMDA_KEYSTORE_BASE64 / _PASSWORD / " +
                    "BALIMDA_KEY_ALIAS / BALIMDA_KEY_PASSWORD secrets). For a test build run assembleDebug instead.")
        }
        if (!file(releaseSigningEnv.file).isFile()) {
            throw new GradleException("BALIMDA_KEYSTORE_FILE points to a file that does not exist: " + releaseSigningEnv.file)
        }
    }
}
